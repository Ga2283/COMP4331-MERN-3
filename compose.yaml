services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mycollection
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
  
  seed:
    build:
      context: ./backend
    command: ["node", "seed.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/mycollection
      SEED_USERNAME: ${SEED_USERNAME:-demo}
      SEED_EMAIL: ${SEED_EMAIL:-demo@example.com}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
