services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/mycollection
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      EMAIL_USER: ${EMAIL_USER:-c1bdba001@smtp-brevo.com}
      SMTP_KEY: ${SENDINBLUE_KEY}
      BASE_URL: ${BASE_URL:-https://mern.gabrielf2283.com}

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api

volumes:
    mongo-data:
